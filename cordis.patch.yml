# Mount after the DeepSeek Harness base bundle. The plugin is opt-in and
# contributes a Web A2UI renderer and uses Harness's existing user-question
# transport; it opens no listener or provider connection. Trusted code profiles
# are deployment-configured and execute only through Harness subprocess/sandbox seams.
- insert:
    - id: reliability-governor
      name: '@chenjie1129/dsh-reliability-governor-plugin'
      config:
        maxAttempts: 3
        maxChecks: 20
        maxFileBytes: 1048576
        autoVerifyAtTurnStop: true
        codeVerificationMaxOutputBytes: 65536
        codeVerificationProfiles: []
        businessOutcomeMaxOutputBytes: 65536
        businessOutcomeProfiles: []
        contractAuthoring:
          mode: current-agent
          maxInputBytes: 32768
          maxOutputTokens: 3000
          timeoutMs: 45000
        contractReview:
          mode: required
